    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: https:; media-src data: https:; connect-src 'none'; font-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Device Access Toolkit Preview</title>
    <link rel="stylesheet" href="preview.css" />
    <style>
      :root {
        color-scheme: light dark;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }

      body {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #extension-guidance {
        --color-text-primary: light-dark(#0a1317, #dfe2e5);
        --color-text-secondary: light-dark(#4e606f, #aaafb5);
        --color-background-body: light-dark(#f1f4f7, #111112);
        --color-background-card: light-dark(#ffffff, #1f1f22);
        --color-border: light-dark(#05365919, #f2f4f619);
        --color-accent: light-dark(#0064e0, #2694fe);
        --color-on-accent: #ffffff;
        --color-overlay-hover: light-dark(#0536590c, #ffffff0c);
        --color-overlay-pressed: light-dark(#05365919, #ffffff19);
        --spacing-1: 4px;
        --spacing-2: 8px;
        --spacing-3: 12px;
        --spacing-4: 16px;
        --spacing-5: 20px;
        --spacing-6: 24px;
        --spacing-8: 32px;
        --spacing-9: 36px;
        --spacing-10: 40px;
        --spacing-11: 44px;
        --spacing-12: 48px;
        --size-element-md: 32px;
        --size-element-lg: 36px;
        --border-width: 1px;
        --focus-outline-width: 2px;
        --focus-outline-style: solid;
        --focus-outline-offset: 3px;
        --radius-element: 8px;
        --radius-container: 12px;
        --duration-fast: 175ms;
        --ease-standard: cubic-bezier(0.24, 1, 0.4, 1);
        --font-family-body: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        --font-size-sm: 0.75rem;
        --font-size-base: 0.875rem;
        --font-size-lg: 1.0625rem;
        --font-weight-normal: 400;
        --font-weight-medium: 500;
        --font-weight-semibold: 600;
        --text-body-size: var(--font-size-base);
        --text-body-weight: var(--font-weight-normal);
        --text-body-leading: 1.4286;
        --text-label-size: var(--font-size-base);
        --text-label-weight: var(--font-weight-medium);
        --text-label-leading: 1.4286;
        --text-large-size: var(--font-size-lg);
        --text-large-weight: var(--font-weight-semibold);
        --text-large-leading: 1.4118;
        --text-supporting-size: var(--font-size-sm);
        --text-supporting-weight: var(--font-weight-normal);
        --text-supporting-leading: 1.6667;
        display: none;
        width: 100%;
        height: 100%;
        padding: var(--spacing-6);
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        background: var(--color-background-body);
        color: var(--color-text-primary);
        font-family: var(--font-family-body);
      }

      html[data-dat-preview-ready='true']:not(.mdcs-active)
        #extension-guidance {
        display: flex;
      }

      html[data-dat-preview-ready='true']:not(.mdcs-active) #app {
        display: none;
      }

      .extension-guidance-card {
        width: min(100%, 480px);
        box-sizing: border-box;
        overflow: clip;
        border: var(--border-width) solid var(--color-border);
        border-radius: var(--radius-container);
        background: var(--color-background-card);
      }

      .extension-guidance-state {
        display: flex;
        padding: calc(var(--spacing-12) - var(--border-width))
          calc(var(--spacing-10) - var(--border-width));
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-4);
        text-align: center;
      }

      .extension-guidance-mark {
        display: block;
        width: calc(var(--spacing-8) * 2);
        height: calc(var(--spacing-8) * 2);
      }

      .extension-guidance-copy {
        display: flex;
        max-width: 360px;
        flex-direction: column;
        align-items: center;
      }

      .extension-guidance-state h1 {
        margin: 0;
        color: var(--color-text-primary);
        font-size: var(--text-large-size);
        font-weight: var(--text-large-weight);
        line-height: var(--text-large-leading);
      }

      .extension-guidance-description {
        margin: 0;
        color: var(--color-text-secondary);
        font-size: var(--text-body-size);
        font-weight: var(--text-body-weight);
        line-height: var(--text-body-leading);
      }

      .extension-guidance-action {
        display: inline-flex;
        height: var(--size-element-lg);
        margin-top: var(--spacing-1);
        padding: var(--spacing-2) var(--spacing-3);
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-2);
        border-radius: var(--radius-element);
        background-color: var(--color-accent);
        color: var(--color-on-accent);
        font-size: var(--text-label-size);
        font-weight: var(--text-label-weight);
        line-height: var(--text-label-leading);
        text-decoration: none;
        white-space: nowrap;
        transition-duration: var(--duration-fast);
        transition-property:
          background-image, background-color, color, opacity, transform;
        transition-timing-function: var(--ease-standard);
      }

      .extension-guidance-action svg {
        width: var(--spacing-5);
        height: var(--spacing-5);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      @media (hover: hover) {
        .extension-guidance-action:hover {
          background-image: linear-gradient(
            var(--color-overlay-hover),
            var(--color-overlay-hover)
          );
        }
      }

      .extension-guidance-action:active {
        background-image: linear-gradient(
          var(--color-overlay-pressed),
          var(--color-overlay-pressed)
        );
        transform: scale(0.98);
      }

      .extension-guidance-action:focus-visible {
        outline-color: var(--color-accent);
        outline-offset: var(--focus-outline-offset);
        outline-style: var(--focus-outline-style);
        outline-width: var(--focus-outline-width);
      }

      @media (pointer: coarse) {
        .extension-guidance-action {
          min-height: var(--spacing-11);
        }
      }

      .extension-guidance-enable {
        display: flex;
        width: 100%;
        max-width: 360px;
        padding-top: var(--spacing-4);
        flex-direction: column;
        align-items: center;
        gap: var(--spacing-1);
        border-top: var(--border-width) solid var(--color-border);
      }

      .extension-guidance-enable h2 {
        margin: 0;
        color: var(--color-text-primary);
        font-size: var(--text-body-size);
        font-weight: var(--font-weight-semibold);
        line-height: var(--text-body-leading);
      }

      .extension-guidance-enable p {
        margin: 0;
        color: var(--color-text-secondary);
        font-size: var(--text-body-size);
        font-weight: var(--text-body-weight);
        line-height: var(--text-body-leading);
      }

      @media (max-width: 420px), (max-height: 420px) {
        #extension-guidance {
          padding: var(--spacing-4);
        }

        .extension-guidance-state {
          padding: calc(var(--spacing-8) - var(--border-width));
          gap: var(--spacing-2);
        }

        .extension-guidance-mark {
          width: var(--spacing-12);
          height: var(--spacing-12);
        }

        .extension-guidance-state h1 {
          font-size: var(--text-label-size);
          line-height: var(--text-label-leading);
        }

        .extension-guidance-description,
        .extension-guidance-enable p {
          font-size: var(--text-supporting-size);
          font-weight: var(--text-supporting-weight);
          line-height: var(--text-supporting-leading);
        }

        .extension-guidance-action {
          height: var(--size-element-md);
        }

        .extension-guidance-action svg {
          width: var(--spacing-4);
          height: var(--spacing-4);
        }

        .extension-guidance-enable {
          padding-top: var(--spacing-3);
        }
      }

      @media (max-height: 320px) {
        #extension-guidance {
          align-items: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .extension-guidance-action {
          transition-duration: 0s;
        }
      }

      #app {
        position: relative;
        display: flex;
        width: 600px;
        height: 600px;
        flex: 0 0 auto;
        flex-direction: column;
        box-sizing: border-box;
        overflow-x: hidden;
        overflow-y: auto;
        background: transparent;
        -webkit-overflow-scrolling: touch;
      }

      #app > [data-app-root] {
        min-height: 100%;
        box-sizing: border-box;
      }
    </style>
  </head>
